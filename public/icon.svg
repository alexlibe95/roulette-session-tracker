<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Roulette session tracker">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#12304a"/>
      <stop offset="55%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dffff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>

  <!-- HUD ticks -->
  <g fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M256 46 v28"/>
    <path d="M256 438 v28"/>
    <path d="M46 256 h28"/>
    <path d="M438 256 h28"/>
    <path d="M108 108 l18 18"/>
    <path d="M386 386 l18 18"/>
    <path d="M108 404 l18 -18"/>
    <path d="M386 126 l18 -18"/>
  </g>

  <!-- Wheel -->
  <g transform="translate(256 256)">
    <circle r="168" fill="#0a101c" stroke="url(#ring)" stroke-width="10"/>
    <g>
      <path d="M0 0 L0 -152 A152 152 0 0 1 76 -131.6 Z" fill="#ff3b6b"/>
      <path d="M0 0 L76 -131.6 A152 152 0 0 1 131.6 -76 Z" fill="#141a24"/>
      <path d="M0 0 L131.6 -76 A152 152 0 0 1 152 0 Z" fill="#ff3b6b"/>
      <path d="M0 0 L152 0 A152 152 0 0 1 131.6 76 Z" fill="#141a24"/>
      <path d="M0 0 L131.6 76 A152 152 0 0 1 76 131.6 Z" fill="#00ffa6"/>
      <path d="M0 0 L76 131.6 A152 152 0 0 1 0 152 Z" fill="#141a24"/>
      <path d="M0 0 L0 152 A152 152 0 0 1 -76 131.6 Z" fill="#ff3b6b"/>
      <path d="M0 0 L-76 131.6 A152 152 0 0 1 -131.6 76 Z" fill="#141a24"/>
      <path d="M0 0 L-131.6 76 A152 152 0 0 1 -152 0 Z" fill="#ff3b6b"/>
      <path d="M0 0 L-152 0 A152 152 0 0 1 -131.6 -76 Z" fill="#141a24"/>
      <path d="M0 0 L-131.6 -76 A152 152 0 0 1 -76 -131.6 Z" fill="#ff3b6b"/>
      <path d="M0 0 L-76 -131.6 A152 152 0 0 1 0 -152 Z" fill="#141a24"/>
    </g>
    <circle r="152" fill="none" stroke="#05070d" stroke-width="3" opacity="0.35"/>
    <circle r="78" fill="#071018" stroke="#00f0ff" stroke-width="5"/>
    <circle r="54" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.45"/>
    <circle r="18" fill="#00f0ff" filter="url(#soft)"/>
    <circle r="7" fill="#e7f6ff"/>
    <!-- ball -->
    <circle cx="118" cy="-72" r="14" fill="#e7f6ff" stroke="#00f0ff" stroke-width="3"/>
  </g>

  <!-- orbital arcs -->
  <path d="M92 180 A176 176 0 0 1 332 92" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M420 332 A176 176 0 0 1 180 420" fill="none" stroke="#ff2bd6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
